server:
  port: ${PORT:8197}
  servlet:
    context-path: /users

spring:
  application:
    name: users
    version: @project.version@
  profiles:
    active: dev

  # Configurações de Banco de Dados e JPA (Suportado pelo core-jpa)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/glaiss?currentSchema=gl_user&TimeZone=America/Sao_Paulo}
    username: ${USER_DB:gl_user_app}
    password: ${PASSWORD_DB:gl_user}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: gl_user
        jdbc:
          time_zone: America/Sao_Paulo
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: gl_user
    user: ${USER_DB_FLYWAY:gl_user}
    password: ${PASSWORD_DB_FLYWAY:gl_user}
    baseline-on-migrate: true

  # Configurações de Serialização (Suportado pelo core-common)
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss
    time-zone: America/Sao_Paulo
    deserialization:
      fail-on-unknown-properties: false

  # Desabilitar Feign e integrações não utilizadas (conforme core-security/cloud)
  feign:
    client:
      enabled: false

  # Integrações Cloud
  cloud:
    discovery:
      enabled: ${DISCOVERY_ENABLED:true}
    loadbalancer:
      enabled: true

# Configurações de Segurança (Suportado pelo core-security)
security:
  jwt:
    issuer: glaiss-auth
    expiration-minutes: 60

jwt:
  public:
    key: |
      -----BEGIN PUBLIC KEY-----
      MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAxyxs9a0bpYdH9x2hfjNS
      yNnz4FXmSpPz9CRLbtVlvghnZ4G9HB3Z++Z2HfpLIPahoCyp+Bi8b9gmDue3qRAn
      cSNH16LCcNrOYFapz9MoW3U6ijOKZJsowdWDnHY8e3FjSBTw5s4X9c2wha2v9Erj
      QNYdIIDXmqWoWm2206MsDzbwQ4bQo69/zMYU0xUmI0ZQViYVa6DVvXXZrYyyLNOv
      JrSxF+Fs3fN3Mv6/rELmwrR9KJNL+NaKuQW7BDV8L0f5m6davtQwzSmwkR+BlT97
      4wPPPdnZN+CzRW+7wAHTsMw1D8nEtL2bkHh1X82p+2nyMl+qQ/FtTaYEvbnazPGs
      ewIDAQAB
      -----END PUBLIC KEY-----
  private:
    key: ${JWT_PRIVATE_KEY:classpath:private.key}

github:
  oauth:
    client:
      id: ${GITHUB_CLIENT_ID:}
      secret: ${GITHUB_CLIENT_SECRET:}
      redirect-uri: ${GITHUB_CLIENT_REDIRECT_URI:}

google:
  oauth:
    client:
      id: ${GOOGLE_CLIENT_ID:}
      secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_CLIENT_REDIRECT_URI:}

# Configurações Específicas da Aplicação
servico-externos-permitidos: ${ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201}

# Eureka Client
eureka:
  client:
    enabled: ${DISCOVERY_ENABLED:true}
    service-url:
      defaultZone: ${URL_DISCOVERY:http://localhost:8761/discovery/eureka}
    register-with-eureka: ${EUREKA_REGISTER:true}
  instance:
    instance-id: ${spring.application.name}:${server.port}
    prefer-ip-address: true

# Observabilidade e Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,tracing
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

logging:
  level:
    root: INFO
    com.glaiss: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [traceId=%X{traceId:-}, spanId=%X{spanId:-}] - %msg%n"

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201}
